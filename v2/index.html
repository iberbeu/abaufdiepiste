<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1526">
<title>Ab auf die Piste</title>
<link rel="icon" type="image/png" href="../img/logo_abaufdiepiste.png">
<link rel="preload" href="fonts/work_sans_latin_800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="v2_tokens.css">
<link rel="stylesheet" href="v2_components.css">
<link rel="stylesheet" href="v2_screens.css">
<!-- DEV ONLY — remove before shipping -->
<link rel="stylesheet" href="v2_dev_fixtures.css">
</head>
<body>

<div class="app">
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="btnMenu" aria-label="Menü"><span class="icon icon--menu"></span></button>
    <span class="topbar__clock"><span class="topbar__time" id="topbarTime"></span><span class="topbar__round" id="topbarRound"></span></span>
    <div class="topbar__actions" id="quickActions">
      <button class="icon-btn" id="btnSight" aria-label="Sehenswürdigkeit"><span class="icon icon--camera"></span></button>
      <button class="icon-btn" id="btnGratis" aria-label="Gratis Fahrt"><span class="icon icon--ticket"></span><span class="icon-btn__badge" id="gratisCount" hidden></span></button>
      <button class="icon-btn" id="btnJoker" aria-label="Joker"><span class="icon icon--joker"></span><span class="icon-btn__badge icon-btn__badge--joker" id="jokerCount" hidden></span></button>
    </div>
  </header>
  <button class="score-strip" id="scoreStrip" hidden></button>
  <main class="outlet" id="outlet"></main>
</div>
<div id="sheetHost"></div>
<div class="fx-host" id="fxHost" aria-hidden="true"></div>

<!-- ══════════════ TEMPLATES (cloned by the screen modules) ══════════════ -->

<template id="tpl-score-chip">
  <span class="score-chip"><span class="avatar"></span><span class="score-chip__points"></span></span>
</template>

<template id="tpl-sheet">
  <div class="sheet-layer">
    <div class="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 class="sheet__title" data-ref="title"></h2>
      <p class="sheet__text" data-ref="text"></p>
      <div class="sheet__body" data-ref="body"></div>
      <div class="sheet__actions" data-ref="actions"></div>
    </div>
  </div>
</template>

<template id="tpl-sheet-primary">
  <button class="btn-primary"></button>
</template>

<template id="tpl-sheet-text">
  <button class="btn-text"></button>
</template>

<!-- Celebrations (v2_fx.js) -->
<template id="tpl-level-up">
  <div class="level-up" role="img"></div>
</template>

<template id="tpl-confetti">
  <div class="confetti">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
</template>

<template id="tpl-home">
  <section class="screen home">
    <img class="home__logo" src="../img/logo_abaufdiepiste.png" alt="">
    <h1 class="home__title">Ab auf die Piste</h1>
    <div class="action-list">
      <button class="btn-action btn-action--bergab" data-ref="continue" hidden>
        <span>Weiterspielen<span class="btn-action__sub" data-ref="continueSub"></span></span>
      </button>
      <button class="btn-action btn-action--bergauf" data-ref="newGame">
        <span>Neues Spiel<span class="btn-action__sub">Die App würfelt für euch</span></span>
      </button>
      <button class="btn-action btn-action--pause" data-ref="punkteblock">
        <span>Punkteblock<span class="btn-action__sub btn-action__sub--wrap">Kein Papier-Punkteblock zur Hand? Hier die Punkte eintragen – gewürfelt wird mit den echten Würfeln.</span></span>
      </button>
    </div>
  </section>
</template>

<!-- ── SETUP WIZARD (flow_spec §4) ── -->

<template id="tpl-setup_players">
  <section class="screen wizard">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <span class="wizard__dots" role="img" aria-label="Schritt 1 von 4"><span class="dot is-used"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
    </header>
    <h1 class="wizard__title">Wie viele spielen?</h1>
    <div class="number-grid" data-ref="numbers"></div>
  </section>
</template>

<template id="tpl-number-tile">
  <button class="number-tile"></button>
</template>

<template id="tpl-setup_names">
  <section class="screen wizard">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <span class="wizard__dots" role="img" aria-label="Schritt 2 von 4"><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot"></span><span class="dot"></span></span>
    </header>
    <h1 class="wizard__title">Wer spielt mit?</h1>
    <ol class="player-rows" data-ref="rows"></ol>
    <p class="wizard__hint">Kreis antippen = Farbe deiner Spielfigur wählen.<br>Wer am wenigsten Skierfahrung hat, beginnt.</p>
    <button class="btn-primary wizard__cta" data-ref="next">Weiter →</button>
  </section>
</template>

<template id="tpl-name-row">
  <li class="player-row">
    <button class="player-row__handle" data-ref="handle" aria-label="Reihenfolge ändern (Pfeiltasten)"><span class="icon icon--grip"></span></button>
    <button class="avatar avatar--md" data-ref="color" aria-label="Farbe wählen"></button>
    <input class="text-field" data-ref="input" type="text" maxlength="16" autocomplete="off" autocapitalize="words" enterkeyhint="next">
  </li>
</template>

<template id="tpl-swatches">
  <div class="swatches"></div>
</template>

<template id="tpl-swatch">
  <div class="swatch-option">
    <button class="swatch" data-ref="button"><span class="swatch__initial" data-ref="initial"></span></button>
    <span data-ref="name"></span>
  </div>
</template>

<template id="tpl-setup_talstation">
  <section class="screen wizard">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <span class="wizard__dots" role="img" aria-label="Schritt 3 von 4"><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot"></span></span>
    </header>
    <h1 class="wizard__title">Wo ist eure Talstation?</h1>
    <ol class="player-rows player-rows--talstation" data-ref="rows"></ol>
    <button class="btn-primary wizard__cta" data-ref="next">Weiter →</button>
    <button class="btn-text" data-ref="skip">Überspringen</button>
  </section>
</template>

<template id="tpl-talstation-field">
  <li class="player-row">
    <span class="avatar avatar--md" data-ref="avatar"></span>
    <label class="field">
      <span class="field__label" data-ref="name"></span>
      <input class="text-field" data-ref="input" type="text" maxlength="24" autocomplete="off" autocapitalize="words" enterkeyhint="next" placeholder="Talstation">
    </label>
  </li>
</template>

<template id="tpl-setup_length">
  <section class="screen wizard">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <span class="wizard__dots" role="img" aria-label="Schritt 4 von 4"><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot is-used"></span></span>
    </header>
    <h1 class="wizard__title">Wie lange fahrt ihr?</h1>
    <div class="choice-list">
      <button class="choice-tile" data-ref="full" aria-pressed="false">
        <span class="choice-tile__title">Ganzer Tag</span>
        <span class="choice-tile__sub" data-ref="fullSub"></span>
      </button>
      <div class="choice-tile" data-ref="short">
        <button class="choice-tile__select" data-ref="shortSelect" aria-pressed="false">
          <span class="choice-tile__title">Kurz</span>
          <span class="choice-tile__sub" data-ref="shortSub"></span>
        </button>
        <div class="stepper">
          <button class="stepper__btn" data-ref="minus" aria-label="Eine Runde weniger"><span class="icon icon--minus"></span></button>
          <span class="stepper__value" data-ref="value"></span>
          <button class="stepper__btn" data-ref="plus" aria-label="Eine Runde mehr"><span class="icon icon--plus"></span></button>
        </div>
      </div>
    </div>
    <button class="btn-primary wizard__cta" data-ref="start">Los geht's! →</button>
  </section>
</template>

<!-- ── TURN START (flow_spec §5) ── -->

<template id="tpl-turn_start">
  <section class="screen step step--split turn-start">
    <div class="player-hero step__aside" data-ref="hero">
      <span class="avatar avatar--lg" data-ref="avatar" aria-hidden="true"></span>
      <h1 class="player-hero__name" data-ref="name"></h1>
      <span class="stars" data-ref="stars" role="img"></span>
    </div>
    <div class="action-list step__main">
      <button class="btn-action btn-action--bergauf" data-ref="bergauf"><span class="icon icon--lg icon--gondola"></span>Bergauf</button>
      <button class="btn-action btn-action--bergab" data-ref="bergab"><span class="icon icon--lg icon--skier"></span>Bergab</button>
      <button class="btn-action btn-action--pause" data-ref="pause">
        <span class="icon icon--lg icon--restaurant"></span>
        <span>Pause<span class="btn-action__sub btn-action__lock" data-ref="pauseSub" hidden><span class="icon icon--sm icon--lock"></span><span data-ref="pauseReason"></span></span></span>
      </button>
      <button class="btn-text turn-start__pass" data-ref="pass">Passen</button>
    </div>
  </section>
</template>

<!-- ── BERGAUF (flow_spec §5, B1 + B2) ── -->

<template id="tpl-bergauf_roll">
  <section class="screen step step--split bergauf">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Bergauf</h1>
      <span></span>
    </header>
    <div class="dice-grid step__aside" data-ref="dice"></div>
    <div class="step-cta step__cta"><button class="btn-primary" data-ref="roll"><span class="icon icon--dice"></span>Würfeln</button></div>
  </section>
</template>

<template id="tpl-bergauf_result">
  <section class="screen step step--split bergauf">
    <header class="step-head">
      <span></span>
      <h1 class="step-head__title">Bergauf</h1>
      <span class="roll-dots" data-ref="dots" role="img"><span class="dot"></span><span class="dot"></span></span>
    </header>
    <div class="dice-grid step__aside" data-ref="dice"></div>
    <div class="step__main bergauf__info">
      <p class="bergauf__hint" data-ref="hint"></p>
      <ul class="result-lines" data-ref="lines" aria-live="polite"></ul>
    </div>
    <button class="btn-joker" data-ref="joker" aria-pressed="false" hidden><span class="icon icon--sm icon--joker"></span><span data-ref="jokerLabel"></span></button>
    <div class="step-cta step__cta action-stack">
      <button class="btn-primary" data-ref="primary"></button>
      <button class="btn-text" data-ref="secondary"></button>
    </div>
  </section>
</template>

<template id="tpl-transport-die">
  <button class="die die--md" aria-pressed="false">
    <img class="die__img" data-ref="img" alt="">
    <span class="die__corner die__corner--held" data-ref="held" hidden><span class="icon icon--sm icon--lock"></span></span>
    <span class="die__corner die__corner--joker" data-ref="jokered" hidden><span class="icon icon--sm icon--joker"></span></span>
  </button>
</template>

<template id="tpl-result-line">
  <li class="result-line"><span class="icon icon--sm" data-ref="icon"></span><span data-ref="text"></span></li>
</template>

<template id="tpl-face-picker">
  <div class="face-picker"></div>
</template>

<template id="tpl-face-option">
  <button class="face-option"><img class="face-option__img" data-ref="img" alt=""><span class="face-option__name" data-ref="name"></span></button>
</template>

<!-- ── BERGAB (flow_spec §5, D1 + D2) ── -->

<template id="tpl-bergab_roll">
  <section class="screen step bergab">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Bergab</h1>
      <span></span>
    </header>
    <div class="dice-row bergab__dice bergab__dice--big">
      <div class="die" role="img" data-ref="descent"><div class="die__face"><span class="die__value">?</span><span class="die__stars" data-ref="stars"></span></div></div>
      <div class="die die--event"><img class="die__img" src="img/dice/die_question.svg" alt="Ereigniswürfel"></div>
    </div>
    <div class="step-cta"><button class="btn-primary" data-ref="roll"><span class="icon icon--dice"></span>Würfeln</button></div>
  </section>
</template>

<template id="tpl-bergab_result">
  <section class="screen step step--split bergab">
    <h1 class="visually-hidden">Bergab</h1>
    <div class="step__aside bergab__top">
      <div class="dice-row bergab__dice">
        <div class="die" role="img" data-ref="descent"><div class="die__face"><span class="die__value" data-ref="value"></span><span class="die__stars" data-ref="stars"></span></div></div>
        <div class="die die--event" data-ref="event">
          <img class="die__img" data-ref="eventImg" alt="">
          <button class="die__corner die__corner--joker" data-ref="eventJoker" aria-label="Joker einsetzen" hidden><span class="icon icon--sm icon--joker"></span></button>
        </div>
      </div>
      <p class="result-line" data-ref="eventLine" aria-live="polite" hidden></p>
      <p class="visually-hidden" aria-live="polite" data-ref="live"></p>
      <div class="crossings" data-ref="crossings">
        <span class="crossings__label" data-ref="crossLabel"></span>
        <span class="crossings__dots" data-ref="dots"></span>
      </div>
    </div>
    <div class="step__main bergab__main">
      <div class="slope-grid" data-ref="tiles"></div>
      <div class="blocked" data-ref="blocked" hidden>
        <span class="icon icon--lg icon--warning"></span>
        <p class="blocked__text" data-ref="blockedText"></p>
        <button class="btn-joker" data-ref="blockedJoker" hidden><span class="icon icon--sm icon--joker"></span><span data-ref="blockedJokerLabel"></span></button>
      </div>
    </div>
    <button class="round-option bergab__extra" data-ref="extra" aria-label="Extraaktivität" hidden>
      <span class="icon icon--snowboard" data-ref="extraIcon"></span>
      <span class="round-option__label" data-ref="extraLabel" hidden></span>
    </button>
    <div class="step-cta step__cta"><button class="btn-primary" data-ref="primary"></button></div>
  </section>
</template>

<template id="tpl-slope-tile">
  <div class="slope-tile">
    <button class="slope-tile__plus" data-ref="plus"><span class="icon icon--plus"></span></button>
    <span class="slope-tile__name" data-ref="name"></span>
    <span class="slope-tile__pts" data-ref="pts"></span>
    <button class="slope-tile__minus" data-ref="minus"><span class="icon icon--minus"></span></button>
    <span class="slope-tile__count" data-ref="count" hidden></span>
    <span class="slope-tile__flag" data-ref="flag" hidden>
      <span class="icon icon--sm icon--warning" data-ref="warn"></span>
      <img class="slope-tile__smiley" data-ref="smiley" alt="" hidden>
    </span>
  </div>
</template>

<template id="tpl-dot">
  <span class="dot"></span>
</template>

<template id="tpl-decision-die">
  <img class="decision-die" alt="">
</template>

<!-- ── PAUSE (flow_spec §5) ── -->

<template id="tpl-pause">
  <section class="screen step pause">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Mittagspause</h1>
      <span></span>
    </header>
    <div class="pause-tiles">
      <button class="pause-tile" data-ref="restaurant" aria-pressed="false">
        <span class="icon icon--lg icon--restaurant"></span>
        <span class="pause-tile__name">Restaurant</span>
        <span class="pause-tile__pts" data-ref="restaurantPts"></span>
      </button>
      <button class="pause-tile" data-ref="bar" aria-pressed="false">
        <span class="icon icon--lg icon--bar"></span>
        <span class="pause-tile__name">Bar</span>
        <span class="pause-tile__pts" data-ref="barPts"></span>
      </button>
    </div>
    <div class="step-cta"><button class="btn-primary" data-ref="primary" disabled>Restaurant oder Bar?</button></div>
  </section>
</template>

<!-- ── MENU (flow_spec §8) ── -->

<template id="tpl-menu">
  <section class="screen step menu">
    <header class="step-head">
      <button class="icon-btn" data-ref="close" aria-label="Zurück zum Spiel"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Menü</h1>
      <span></span>
    </header>
    <p class="menu__status" data-ref="status"></p>
    <nav class="menu-list" aria-label="Menü">
      <button class="menu-row" data-ref="scores"><span class="icon icon--trophy"></span>Punkte</button>
      <button class="menu-row" data-ref="rules"><span class="icon icon--book"></span>Würfel &amp; Regeln</button>
      <button class="menu-row" data-ref="adjust"><span class="icon icon--sliders"></span>Anpassungen</button>
      <button class="menu-row" data-ref="newGame"><span class="icon icon--plus"></span>Neues Spiel</button>
      <button class="menu-row" data-ref="home"><span class="icon icon--home"></span>Zum Start</button>
    </nav>
  </section>
</template>

<template id="tpl-menu_scores">
  <section class="screen step menu-page">
    <header class="step-head">
      <button class="icon-btn" data-ref="close" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Punkte</h1>
      <span></span>
    </header>
    <ol class="rank-list" data-ref="ranking"></ol>
    <h2 class="menu-page__h2">Punkteverlauf</h2>
    <p class="menu-page__hint" data-ref="empty" hidden>Noch keine Runde gespielt.</p>
    <div class="score-table-wrap" data-ref="tableWrap">
      <table class="score-table">
        <thead><tr data-ref="head"><th scope="col">Zeit</th></tr></thead>
        <tbody data-ref="body"></tbody>
      </table>
    </div>
    <p class="menu-page__hint">Zelle antippen = Details der Runde</p>
  </section>
</template>

<template id="tpl-rank-row">
  <li class="rank-row">
    <span class="rank-row__rank" data-ref="rank"></span>
    <span class="avatar avatar--md" data-ref="avatar" aria-hidden="true"></span>
    <span class="rank-row__name"><span data-ref="name"></span><span class="rank-row__meta" data-ref="meta"></span>
      <span class="rank-row__stats" data-ref="stats" hidden>
        <span class="rank-stat"><span class="icon icon--sm icon--camera"></span><span data-ref="sights"></span></span>
        <span class="rank-stat rank-stat--joker"><span class="icon icon--sm icon--joker"></span><span data-ref="joker"></span></span>
        <span class="rank-stat rank-stat--gratis"><span class="icon icon--sm icon--ticket"></span><span data-ref="gratis"></span></span>
      </span>
    </span>
    <span class="rank-row__points" data-ref="points"></span>
  </li>
</template>

<template id="tpl-score-head">
  <th scope="col"><span class="avatar" data-ref="avatar"></span></th>
</template>

<template id="tpl-score-row">
  <tr><th scope="row" class="score-table__time" data-ref="time"></th></tr>
</template>

<template id="tpl-score-cell">
  <td><button class="score-cell" data-ref="btn"><span class="score-cell__points" data-ref="points"></span><span class="score-cell__delta" data-ref="delta"></span></button></td>
</template>

<template id="tpl-score-empty">
  <td class="score-cell score-cell--empty">–</td>
</template>

<template id="tpl-round-entries">
  <ul class="round-entries"></ul>
</template>

<template id="tpl-round-entry">
  <li class="round-entries__item"></li>
</template>

<template id="tpl-menu_rules">
  <section class="screen step menu-page">
    <header class="step-head">
      <button class="icon-btn" data-ref="close" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Würfel &amp; Regeln</h1>
      <span></span>
    </header>
    <div class="rule-cards" data-ref="cards"></div>
  </section>
</template>

<template id="tpl-rule-card">
  <section class="rule-card">
    <h2 class="rule-card__title" data-ref="title"></h2>
    <ul class="rule-card__list" data-ref="list"></ul>
  </section>
</template>

<template id="tpl-rule-item">
  <li class="rule-item"><img class="rule-item__img" data-ref="img" alt="" hidden><span class="rule-item__label" data-ref="label"></span><span class="rule-item__text" data-ref="text"></span></li>
</template>

<template id="tpl-menu_adjust">
  <section class="screen step menu-page">
    <header class="step-head">
      <button class="icon-btn" data-ref="close" aria-label="Abbrechen"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Anpassungen</h1>
      <span></span>
    </header>
    <p class="menu-page__hint">Nur zum Korrigieren. Max. 2 Münzen pro Person.</p>
    <div class="adjust-list" data-ref="players"></div>
    <div class="step-cta"><button class="btn-primary" data-ref="save">Speichern</button></div>
  </section>
</template>

<template id="tpl-adjust-card">
  <section class="adjust-card">
    <h2 class="adjust-card__head"><span class="avatar avatar--md" data-ref="avatar" aria-hidden="true"></span><span data-ref="name"></span></h2>
    <div class="adjust-card__row" data-field="points">
      <span class="adjust-card__label">Punkte</span>
      <div class="stepper">
        <button class="stepper__btn" data-step="-1"><span class="icon icon--minus"></span></button>
        <input class="stepper__input" type="number" inputmode="numeric" data-ref="points">
        <button class="stepper__btn" data-step="1"><span class="icon icon--plus"></span></button>
      </div>
    </div>
    <div class="adjust-card__row" data-field="joker">
      <span class="adjust-card__label">Joker</span>
      <div class="stepper">
        <button class="stepper__btn" data-step="-1"><span class="icon icon--minus"></span></button>
        <span class="stepper__value" data-ref="joker"></span>
        <button class="stepper__btn" data-step="1"><span class="icon icon--plus"></span></button>
      </div>
    </div>
    <div class="adjust-card__row" data-field="gratis">
      <span class="adjust-card__label">Gratis Fahrt</span>
      <div class="stepper">
        <button class="stepper__btn" data-step="-1"><span class="icon icon--minus"></span></button>
        <span class="stepper__value" data-ref="gratis"></span>
        <button class="stepper__btn" data-step="1"><span class="icon icon--plus"></span></button>
      </div>
    </div>
  </section>
</template>

<!-- ── GAME END · SCHLUSSWERTUNG · RANKING (flow_spec §6) ── -->

<template id="tpl-game_end">
  <section class="screen event-card game-end">
    <span class="icon icon--lg icon--trophy"></span>
    <h1 class="event-card__title">Skitag vorbei!</h1>
    <p class="game-end__time" data-ref="time"></p>
    <p class="event-card__text">Alle bleiben, wo sie gerade sind. Jetzt wird abgerechnet.</p>
    <div class="step-cta"><button class="btn-primary" data-ref="start">Schlusswertung starten →</button></div>
  </section>
</template>

<template id="tpl-schlusswertung">
  <section class="screen step schlusswertung">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück" hidden><span class="icon icon--back"></span></button>
      <span class="step-head__title" data-ref="progress"></span>
      <span></span>
    </header>
    <div class="player-hero" data-ref="hero">
      <span class="avatar avatar--lg" data-ref="avatar" aria-hidden="true"></span>
      <h1 class="player-hero__name" data-ref="name"></h1>
    </div>

    <div class="sw-step" data-ref="stepReached">
      <p class="sw-step__question">Talstation erreicht?</p>
      <p class="sw-step__place" data-ref="talstation"></p>
      <div class="sw-choice">
        <button class="btn-primary btn-primary--secondary" data-ref="yes">Ja</button>
        <button class="btn-primary btn-primary--negative" data-ref="no">Nein</button>
      </div>
    </div>

    <div class="sw-step sw-step--return" data-ref="stepReturn" hidden>
      <p class="sw-step__question">Rückweg zur Talstation</p>
      <div class="slope-grid" data-ref="tiles"></div>
      <div class="sw-step__rows">
        <div class="adjust-card__row">
          <span class="adjust-card__label">Beförderungen</span>
          <div class="stepper" data-field="transports">
            <button class="stepper__btn" data-step="-1" aria-label="Eine Beförderung weniger"><span class="icon icon--minus"></span></button>
            <span class="stepper__value" data-ref="transports"></span>
            <button class="stepper__btn" data-step="1" aria-label="Eine Beförderung mehr"><span class="icon icon--plus"></span></button>
          </div>
        </div>
        <div class="adjust-card__row">
          <span class="adjust-card__label">Zusätzliche Talstationen</span>
          <div class="stepper" data-field="extraTalstationen">
            <button class="stepper__btn" data-step="-1" aria-label="Eine Talstation weniger"><span class="icon icon--minus"></span></button>
            <span class="stepper__value" data-ref="extraTalstationen"></span>
            <button class="stepper__btn" data-step="1" aria-label="Eine Talstation mehr"><span class="icon icon--plus"></span></button>
          </div>
        </div>
        <p class="sw-step__penalty" data-ref="penalty" aria-live="polite"></p>
      </div>
      <div class="step-cta"><button class="btn-primary" data-ref="toSummary">Weiter →</button></div>
    </div>

    <div class="sw-step" data-ref="stepSummary" hidden>
      <ul class="summary-lines" data-ref="lines"></ul>
      <p class="summary-total"><span>Gesamt</span><span data-ref="total"></span></p>
      <div class="step-cta"><button class="btn-primary" data-ref="confirm">Bestätigen →</button></div>
    </div>
  </section>
</template>

<template id="tpl-summary-line">
  <li class="summary-line"><span data-ref="label"></span><span class="summary-line__amount" data-ref="amount"></span></li>
</template>

<template id="tpl-ranking">
  <section class="screen step ranking">
    <h1 class="ranking__title">Rangliste</h1>
    <ol class="podium" data-ref="podium"></ol>
    <ol class="rank-list" data-ref="rest"></ol>
    <div class="step-cta action-stack">
      <button class="btn-primary" data-ref="newGame">Neues Spiel</button>
      <button class="btn-text" data-ref="history">Punkteverlauf</button>
    </div>
  </section>
</template>

<template id="tpl-podium-place">
  <li class="podium__place">
    <span class="avatar avatar--md" data-ref="avatar" aria-hidden="true"></span>
    <span class="podium__name" data-ref="name"></span>
    <span class="podium__points" data-ref="points"></span>
    <span class="podium__block" data-ref="rank"></span>
  </li>
</template>

<!-- ── PUNKTEBLOCK MODE (flow_spec §7, FEAT-24) ── -->

<template id="tpl-punkteblock">
  <section class="screen step punkteblock">
    <header class="step-head">
      <button class="icon-btn" data-ref="home" aria-label="Zum Start"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Punkteblock</h1>
      <button class="btn-text" data-ref="newPad">Neu</button>
    </header>
    <div class="pad-wrap">
      <table class="pad">
        <thead data-ref="head">
          <tr data-ref="names"><th scope="col" class="pad__corner"></th></tr>
          <tr class="pad__total" data-ref="totals"><th scope="row" class="pad__label">Total</th></tr>
        </thead>
        <tbody data-ref="body"></tbody>
        <tfoot>
          <tr class="pad__final" data-ref="finalRow"><th scope="row" class="pad__label">Schluss</th></tr>
          <tr class="pad__total" data-ref="endRow"><th scope="row" class="pad__label">Endstand</th></tr>
        </tfoot>
      </table>
    </div>
  </section>
</template>

<template id="tpl-punkteblock_end">
  <section class="screen step ranking">
    <h1 class="ranking__title">Endstand</h1>
    <ol class="podium" data-ref="podium"></ol>
    <ol class="rank-list" data-ref="rest"></ol>
    <div class="step-cta action-stack">
      <button class="btn-primary" data-ref="done">Fertig</button>
      <button class="btn-text" data-ref="edit">Zurück &amp; bearbeiten</button>
    </div>
  </section>
</template>

<template id="tpl-pad-event">
  <span class="icon icon--lg pad-event__icon" data-ref="icon"></span>
</template>

<template id="tpl-pad-player">
  <th scope="col" class="pad__player"><span class="avatar" data-ref="avatar" aria-hidden="true"></span><span class="pad__name" data-ref="name"></span><span class="pad__talstation" data-ref="talstation"></span></th>
</template>

<template id="tpl-pad-row">
  <tr><th scope="row" class="pad__label" data-ref="label"></th></tr>
</template>

<template id="tpl-pad-cell">
  <td><button class="pad__cell" data-ref="btn"><span data-ref="value"></span><span class="pad__next" data-ref="next" hidden>nächste</span></button></td>
</template>

<template id="tpl-pad-value">
  <td class="pad__value"></td>
</template>

<template id="tpl-pad-entry">
  <div class="pad-entry">
    <div class="pad-entry__display">
      <button class="stepper__btn" data-ref="sign" aria-label="Plus oder Minus">±</button>
      <input class="pad-entry__input" type="number" inputmode="numeric" data-ref="input" aria-label="Punkte">
      <button class="btn-text" data-ref="clear">Löschen</button>
    </div>
    <div class="chip-grid" data-ref="chips"></div>
  </div>
</template>

<template id="tpl-chip">
  <button class="chip"></button>
</template>

<template id="tpl-turn_end">
  <section class="screen turn-end">
    <span class="points-burst" data-ref="burst"></span>
    <span class="turn-end__check" data-ref="check" hidden><span class="icon icon--check"></span></span>
  </section>
</template>

<template id="tpl-round_event">
  <section class="screen event-card">
    <span class="icon icon--lg" data-ref="icon"></span>
    <h1 class="event-card__title" data-ref="title"></h1>
    <p class="event-card__text" data-ref="text"></p>
    <ul class="talstation-list" data-ref="talstationen" hidden></ul>
    <button class="btn-primary" data-ref="ok">OK</button>
  </section>
</template>

<template id="tpl-talstation-row">
  <li class="talstation-list__row"><span class="talstation-list__dot"></span><span data-ref="name"></span><span class="talstation-list__place" data-ref="talstation"></span></li>
</template>

<script type="module" src="v2_main.js"></script>
<!-- DEV ONLY — remove before shipping -->
<script type="module" src="v2_dev_fixtures.js"></script>
</body>
</html>
