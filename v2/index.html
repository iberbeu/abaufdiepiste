<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1526">
<title>Ab auf die Piste</title>
<link rel="icon" type="image/png" href="../img/logo_abaufdiepiste.png">
<link rel="preload" href="fonts/work_sans_latin_800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="v2_tokens.css">
<link rel="stylesheet" href="v2_components.css">
<link rel="stylesheet" href="v2_screens.css">
<!-- DEV ONLY — remove before shipping -->
<link rel="stylesheet" href="v2_dev_fixtures.css">
</head>
<body>

<div class="app">
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="btnMenu" aria-label="Menü"><span class="icon icon--menu"></span></button>
    <span class="topbar__time" id="topbarTime"></span>
    <div class="topbar__actions" id="quickActions">
      <button class="icon-btn" id="btnSight" aria-label="Sehenswürdigkeit"><span class="icon icon--camera"></span></button>
      <button class="icon-btn" id="btnGratis" aria-label="Gratis Fahrt"><span class="icon icon--ticket"></span><span class="icon-btn__badge" id="gratisCount" hidden></span></button>
      <button class="icon-btn" id="btnJoker" aria-label="Joker"><span class="icon icon--joker"></span><span class="icon-btn__badge icon-btn__badge--joker" id="jokerCount" hidden></span></button>
    </div>
  </header>
  <button class="score-strip" id="scoreStrip" hidden></button>
  <main class="outlet" id="outlet"></main>
</div>
<div id="sheetHost"></div>

<!-- ══════════════ TEMPLATES (cloned by the screen modules) ══════════════ -->

<template id="tpl-score-chip">
  <span class="score-chip"><span class="avatar"></span><span class="score-chip__points"></span></span>
</template>

<template id="tpl-sheet">
  <div class="sheet-layer">
    <div class="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 class="sheet__title" data-ref="title"></h2>
      <p class="sheet__text" data-ref="text"></p>
      <div class="sheet__body" data-ref="body"></div>
      <div class="sheet__actions" data-ref="actions"></div>
    </div>
  </div>
</template>

<template id="tpl-sheet-primary">
  <button class="btn-primary"></button>
</template>

<template id="tpl-sheet-text">
  <button class="btn-text"></button>
</template>

<template id="tpl-home">
  <section class="screen home">
    <img class="home__logo" src="../img/logo_abaufdiepiste.png" alt="">
    <h1 class="home__title">Ab auf die Piste</h1>
    <div class="action-list">
      <button class="btn-action btn-action--bergab" data-ref="continue" hidden>
        <span>Weiterspielen<span class="btn-action__sub" data-ref="continueSub"></span></span>
      </button>
      <button class="btn-action btn-action--bergauf" data-ref="newGame">Neues Spiel</button>
      <button class="btn-action btn-action--pause" data-ref="punkteblock">Punkteblock</button>
    </div>
  </section>
</template>

<!-- ── SETUP WIZARD (flow_spec §4) ── -->

<template id="tpl-setup_players">
  <section class="screen wizard">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <span class="wizard__dots" role="img" aria-label="Schritt 1 von 4"><span class="dot is-used"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
    </header>
    <h1 class="wizard__title">Wie viele spielen?</h1>
    <div class="number-grid" data-ref="numbers"></div>
  </section>
</template>

<template id="tpl-number-tile">
  <button class="number-tile"></button>
</template>

<template id="tpl-setup_names">
  <section class="screen wizard">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <span class="wizard__dots" role="img" aria-label="Schritt 2 von 4"><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot"></span><span class="dot"></span></span>
    </header>
    <h1 class="wizard__title">Wer spielt mit?</h1>
    <ol class="player-rows" data-ref="rows"></ol>
    <p class="wizard__hint">Wer am wenigsten Skierfahrung hat, beginnt.</p>
    <button class="btn-primary wizard__cta" data-ref="next">Weiter →</button>
  </section>
</template>

<template id="tpl-name-row">
  <li class="player-row">
    <button class="player-row__handle" data-ref="handle" aria-label="Reihenfolge ändern (Pfeiltasten)"><span class="icon icon--grip"></span></button>
    <button class="avatar avatar--md" data-ref="color" aria-label="Farbe wählen"></button>
    <input class="text-field" data-ref="input" type="text" maxlength="16" autocomplete="off" autocapitalize="words" enterkeyhint="next">
  </li>
</template>

<template id="tpl-swatches">
  <div class="swatches"></div>
</template>

<template id="tpl-swatch">
  <button class="swatch"><span class="swatch__initial"></span></button>
</template>

<template id="tpl-setup_talstation">
  <section class="screen wizard">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <span class="wizard__dots" role="img" aria-label="Schritt 3 von 4"><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot"></span></span>
    </header>
    <h1 class="wizard__title">Wo ist eure Talstation?</h1>
    <ol class="player-rows" data-ref="rows"></ol>
    <button class="btn-primary wizard__cta" data-ref="next">Weiter →</button>
    <button class="btn-text" data-ref="skip">Überspringen</button>
  </section>
</template>

<template id="tpl-talstation-field">
  <li class="player-row">
    <span class="avatar avatar--md" data-ref="avatar"></span>
    <label class="field">
      <span class="field__label" data-ref="name"></span>
      <input class="text-field" data-ref="input" type="text" maxlength="24" autocomplete="off" autocapitalize="words" enterkeyhint="next" placeholder="Talstation">
    </label>
  </li>
</template>

<template id="tpl-setup_length">
  <section class="screen wizard">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <span class="wizard__dots" role="img" aria-label="Schritt 4 von 4"><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot is-used"></span><span class="dot is-used"></span></span>
    </header>
    <h1 class="wizard__title">Wie lange fahrt ihr?</h1>
    <div class="choice-list">
      <button class="choice-tile" data-ref="full" aria-pressed="false">
        <span class="choice-tile__title">Ganzer Tag</span>
        <span class="choice-tile__sub" data-ref="fullSub"></span>
      </button>
      <div class="choice-tile" data-ref="short">
        <button class="choice-tile__select" data-ref="shortSelect" aria-pressed="false">
          <span class="choice-tile__title">Kurz</span>
          <span class="choice-tile__sub" data-ref="shortSub"></span>
        </button>
        <div class="stepper">
          <button class="stepper__btn" data-ref="minus" aria-label="Eine Runde weniger"><span class="icon icon--minus"></span></button>
          <span class="stepper__value" data-ref="value"></span>
          <button class="stepper__btn" data-ref="plus" aria-label="Eine Runde mehr"><span class="icon icon--plus"></span></button>
        </div>
      </div>
    </div>
    <button class="btn-primary wizard__cta" data-ref="start">Los geht's! →</button>
  </section>
</template>

<!-- ── TURN START (flow_spec §5) ── -->

<template id="tpl-turn_start">
  <section class="screen step step--split turn-start">
    <div class="player-hero step__aside" data-ref="hero">
      <span class="avatar avatar--lg" data-ref="avatar" aria-hidden="true"></span>
      <h1 class="player-hero__name" data-ref="name"></h1>
      <span class="stars" data-ref="stars" role="img"></span>
    </div>
    <div class="action-list step__main">
      <button class="btn-action btn-action--bergauf" data-ref="bergauf"><span class="icon icon--lg icon--gondola"></span>Bergauf</button>
      <button class="btn-action btn-action--bergab" data-ref="bergab"><span class="icon icon--lg icon--skier"></span>Bergab</button>
      <button class="btn-action btn-action--pause" data-ref="pause">
        <span class="icon icon--lg icon--restaurant"></span>
        <span>Pause<span class="btn-action__sub btn-action__lock" data-ref="pauseSub" hidden><span class="icon icon--sm icon--lock"></span><span data-ref="pauseReason"></span></span></span>
      </button>
    </div>
  </section>
</template>

<!-- ── BERGAUF (flow_spec §5, B1 + B2) ── -->

<template id="tpl-bergauf_roll">
  <section class="screen step bergauf">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Bergauf</h1>
      <span></span>
    </header>
    <div class="dice-grid" data-ref="dice"></div>
    <div class="step-cta"><button class="btn-primary" data-ref="roll"><span class="icon icon--dice"></span>Würfeln</button></div>
  </section>
</template>

<template id="tpl-bergauf_result">
  <section class="screen step bergauf">
    <header class="step-head">
      <span></span>
      <h1 class="step-head__title">Bergauf</h1>
      <span class="roll-dots" data-ref="dots" role="img"><span class="dot"></span><span class="dot"></span></span>
    </header>
    <div class="dice-grid" data-ref="dice"></div>
    <p class="bergauf__hint" data-ref="hint"></p>
    <ul class="result-lines" data-ref="lines" aria-live="polite"></ul>
    <button class="btn-joker" data-ref="joker" aria-pressed="false" hidden><span class="icon icon--sm icon--joker"></span><span data-ref="jokerLabel"></span></button>
    <div class="step-cta action-stack">
      <button class="btn-primary" data-ref="primary"></button>
      <button class="btn-text" data-ref="secondary"></button>
    </div>
  </section>
</template>

<template id="tpl-transport-die">
  <button class="die die--md" aria-pressed="false">
    <img class="die__img" data-ref="img" alt="">
    <span class="die__corner die__corner--held" data-ref="held" hidden><span class="icon icon--sm icon--lock"></span></span>
    <span class="die__corner die__corner--joker" data-ref="jokered" hidden><span class="icon icon--sm icon--joker"></span></span>
  </button>
</template>

<template id="tpl-result-line">
  <li class="result-line"><span class="icon icon--sm" data-ref="icon"></span><span data-ref="text"></span></li>
</template>

<template id="tpl-face-picker">
  <div class="face-picker"></div>
</template>

<template id="tpl-face-option">
  <button class="face-option"><img class="face-option__img" data-ref="img" alt=""><span class="face-option__name" data-ref="name"></span></button>
</template>

<!-- ── BERGAB (flow_spec §5, D1 + D2) ── -->

<template id="tpl-bergab_roll">
  <section class="screen step bergab">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Bergab</h1>
      <span></span>
    </header>
    <div class="dice-row bergab__dice">
      <div class="die" role="img" data-ref="descent"><div class="die__face"><span class="die__value">?</span><span class="die__stars" data-ref="stars"></span></div></div>
      <div class="die die--event"><img class="die__img" src="../img/die_unknown.svg" alt="Ereigniswürfel"></div>
    </div>
    <div class="step-cta"><button class="btn-primary" data-ref="roll"><span class="icon icon--dice"></span>Würfeln</button></div>
  </section>
</template>

<template id="tpl-bergab_result">
  <section class="screen step step--split bergab">
    <h1 class="visually-hidden">Bergab</h1>
    <div class="step__aside bergab__top">
      <div class="dice-row bergab__dice">
        <div class="die" role="img" data-ref="descent"><div class="die__face"><span class="die__value" data-ref="value"></span><span class="die__stars" data-ref="stars"></span></div></div>
        <div class="die die--event" data-ref="event">
          <img class="die__img" data-ref="eventImg" alt="">
          <button class="die__corner die__corner--joker" data-ref="eventJoker" aria-label="Joker einsetzen" hidden><span class="icon icon--sm icon--joker"></span></button>
        </div>
      </div>
      <p class="result-line" data-ref="eventLine" aria-live="polite" hidden></p>
      <p class="visually-hidden" aria-live="polite" data-ref="live"></p>
      <div class="crossings" data-ref="crossings">
        <span class="crossings__label" data-ref="crossLabel"></span>
        <span class="crossings__dots" data-ref="dots"></span>
      </div>
    </div>
    <div class="step__main bergab__main">
      <div class="slope-grid" data-ref="tiles"></div>
      <div class="blocked" data-ref="blocked" hidden>
        <span class="icon icon--lg icon--warning"></span>
        <p class="blocked__text" data-ref="blockedText"></p>
      </div>
      <button class="round-option" data-ref="extra" aria-label="Extraaktivität" hidden>
        <span class="icon icon--dice" data-ref="extraIcon"></span>
        <span class="round-option__label" data-ref="extraLabel" hidden></span>
      </button>
    </div>
    <div class="step-cta step__cta"><button class="btn-primary" data-ref="primary"></button></div>
  </section>
</template>

<template id="tpl-slope-tile">
  <div class="slope-tile">
    <button class="slope-tile__plus" data-ref="plus"><span class="icon icon--plus"></span></button>
    <span class="slope-tile__name" data-ref="name"></span>
    <span class="slope-tile__pts" data-ref="pts"></span>
    <button class="slope-tile__minus" data-ref="minus"><span class="icon icon--minus"></span></button>
    <span class="slope-tile__count" data-ref="count" hidden></span>
    <span class="slope-tile__flag" data-ref="flag" hidden>
      <span class="icon icon--sm icon--warning" data-ref="warn"></span>
      <img class="slope-tile__smiley" data-ref="smiley" alt="" hidden>
    </span>
  </div>
</template>

<template id="tpl-dot">
  <span class="dot"></span>
</template>

<template id="tpl-decision-die">
  <img class="decision-die" alt="">
</template>

<!-- ── PAUSE (flow_spec §5) ── -->

<template id="tpl-pause">
  <section class="screen step pause">
    <header class="step-head">
      <button class="icon-btn" data-ref="back" aria-label="Zurück"><span class="icon icon--back"></span></button>
      <h1 class="step-head__title">Mittagspause</h1>
      <span></span>
    </header>
    <div class="pause-tiles">
      <button class="pause-tile" data-ref="restaurant" aria-pressed="false">
        <span class="icon icon--lg icon--restaurant"></span>
        <span class="pause-tile__name">Restaurant</span>
        <span class="pause-tile__pts" data-ref="restaurantPts"></span>
      </button>
      <button class="pause-tile" data-ref="bar" aria-pressed="false">
        <span class="icon icon--lg icon--bar"></span>
        <span class="pause-tile__name">Bar</span>
        <span class="pause-tile__pts" data-ref="barPts"></span>
      </button>
    </div>
    <div class="step-cta"><button class="btn-primary" data-ref="primary" disabled>Restaurant oder Bar?</button></div>
  </section>
</template>

<template id="tpl-turn_end">
  <section class="screen turn-end">
    <span class="points-burst" data-ref="burst"></span>
    <span class="turn-end__check" data-ref="check" hidden><span class="icon icon--check"></span></span>
  </section>
</template>

<template id="tpl-round_event">
  <section class="screen event-card">
    <span class="icon icon--lg" data-ref="icon"></span>
    <h1 class="event-card__title" data-ref="title"></h1>
    <p class="event-card__text" data-ref="text"></p>
    <ul class="talstation-list" data-ref="talstationen" hidden></ul>
    <button class="btn-primary" data-ref="ok">OK</button>
  </section>
</template>

<template id="tpl-talstation-row">
  <li class="talstation-list__row"><span class="talstation-list__dot"></span><span data-ref="name"></span><span class="talstation-list__place" data-ref="talstation"></span></li>
</template>

<template id="tpl-placeholder">
  <section class="screen step placeholder">
    <p class="placeholder__tag">Platzhalter · <span data-ref="id"></span></p>
    <h1 class="placeholder__title" data-ref="title"></h1>
    <p class="placeholder__task" data-ref="task"></p>
    <div class="action-list" data-ref="links"></div>
  </section>
</template>

<template id="tpl-placeholder-link">
  <button class="btn-primary btn-primary--secondary"></button>
</template>

<script type="module" src="v2_main.js"></script>
<!-- DEV ONLY — remove before shipping -->
<script type="module" src="v2_dev_fixtures.js"></script>
</body>
</html>
