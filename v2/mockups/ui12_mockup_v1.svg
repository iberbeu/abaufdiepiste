<svg xmlns="http://www.w3.org/2000/svg" width="860" height="860" viewBox="0 0 860 860" font-family="Segoe UI, Arial, sans-serif">
  <!-- UI-12.1 quick mockup: layout and feel only, colours are placeholders -->
  <rect width="860" height="860" fill="#e9eef3"/>
  <text x="215" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2B4B">1 · Zugbeginn</text>
  <text x="645" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2B4B">2 · Bergab (nach dem Wurf)</text>

  <!-- ═════════════ SCREEN 1: TURN START ═════════════ -->
  <g transform="translate(35,50)">
    <rect width="360" height="780" rx="36" fill="#1B2B4B"/>
    <rect x="10" y="10" width="340" height="760" rx="28" fill="#f7f9fb"/>

    <!-- top bar: menu · clock · quick actions -->
    <text x="30" y="52" font-size="24" fill="#1B2B4B">☰</text>
    <text x="115" y="50" font-size="15" font-weight="700" fill="#1B2B4B">🕥 10:30</text>
    <text x="115" y="66" font-size="11" fill="#6b7785">Runde 6 / 20</text>
    <g font-size="17">
      <rect x="208" y="32" width="38" height="34" rx="10" fill="#fff" stroke="#d5dde5"/><text x="216" y="56">📷</text>
      <rect x="252" y="32" width="38" height="34" rx="10" fill="#fff" stroke="#d5dde5"/><text x="260" y="56">🎟</text>
      <circle cx="286" cy="34" r="8" fill="#3A8A8C"/><text x="282" y="38" font-size="10" fill="#fff" font-weight="700">2</text>
      <rect x="296" y="32" width="38" height="34" rx="10" fill="#fff" stroke="#d5dde5"/><text x="304" y="56">🃏</text>
      <circle cx="330" cy="34" r="8" fill="#F59C3C"/><text x="326" y="38" font-size="10" fill="#fff" font-weight="700">1</text>
    </g>

    <!-- score strip -->
    <g font-size="12">
      <rect x="22" y="80" width="316" height="44" rx="14" fill="#fff" stroke="#d5dde5"/>
      <rect x="26" y="84" width="86" height="36" rx="11" fill="#FFE9D6" stroke="#E8431A" stroke-width="2"/>
      <circle cx="42" cy="102" r="8" fill="#E8431A"/><text x="55" y="107" font-weight="700" fill="#1B2B4B">Anna 47</text>
      <circle cx="130" cy="102" r="8" fill="#3A8A8C"/><text x="143" y="107" fill="#1B2B4B">Ben 52</text>
      <circle cx="203" cy="102" r="8" fill="#7B4FC9"/><text x="216" y="107" fill="#1B2B4B">Cla 31</text>
      <circle cx="270" cy="102" r="8" fill="#F59C3C"/><text x="283" y="107" fill="#1B2B4B">Dani 40</text>
    </g>

    <!-- hero: whose turn -->
    <circle cx="180" cy="195" r="46" fill="#E8431A"/>
    <text x="180" y="212" text-anchor="middle" font-size="44" fill="#fff" font-weight="800">A</text>
    <text x="180" y="272" text-anchor="middle" font-size="28" font-weight="800" fill="#1B2B4B">Anna ist dran!</text>
    <text x="180" y="298" text-anchor="middle" font-size="15" fill="#F59C3C">★★☆  <tspan fill="#6b7785">Fortgeschritten · 47 Punkte</tspan></text>

    <text x="180" y="345" text-anchor="middle" font-size="15" fill="#6b7785">Was machst du?</text>

    <!-- three big action tiles -->
    <g>
      <rect x="30" y="362" width="300" height="100" rx="22" fill="#3A8A8C"/>
      <rect x="30" y="456" width="300" height="6" rx="3" fill="#2c6e70"/>
      <text x="62" y="428" font-size="42">🚡</text>
      <text x="120" y="408" font-size="24" font-weight="800" fill="#fff">Bergauf</text>
      <text x="120" y="432" font-size="13" fill="#d9f0f0">6 Beförderungswürfel</text>

      <rect x="30" y="478" width="300" height="100" rx="22" fill="#1B2B4B"/>
      <rect x="30" y="572" width="300" height="6" rx="3" fill="#0f1a30"/>
      <text x="62" y="544" font-size="42">⛷️</text>
      <text x="120" y="524" font-size="24" font-weight="800" fill="#fff">Bergab</text>
      <text x="120" y="548" font-size="13" fill="#c4cde0">Abfahrt + Ereignis</text>

      <rect x="30" y="594" width="300" height="100" rx="22" fill="#e1e6ec"/>
      <text x="62" y="660" font-size="42" opacity="0.45">🍽</text>
      <text x="120" y="640" font-size="24" font-weight="800" fill="#9aa5b1">Pause</text>
      <text x="120" y="664" font-size="13" fill="#9aa5b1">🔒 ab 11:00 möglich</text>
    </g>

    <text x="180" y="738" text-anchor="middle" font-size="11" fill="#9aa5b1">Tippen = direkt weiter zum nächsten Schritt</text>
  </g>

  <!-- ═════════════ SCREEN 2: BERGAB ═════════════ -->
  <g transform="translate(465,50)">
    <rect width="360" height="780" rx="36" fill="#1B2B4B"/>
    <rect x="10" y="10" width="340" height="760" rx="28" fill="#f7f9fb"/>

    <!-- same top bar -->
    <text x="30" y="52" font-size="24" fill="#1B2B4B">☰</text>
    <text x="115" y="50" font-size="15" font-weight="700" fill="#1B2B4B">🕥 10:30</text>
    <text x="115" y="66" font-size="11" fill="#6b7785">Runde 6 / 20</text>
    <g font-size="17">
      <rect x="208" y="32" width="38" height="34" rx="10" fill="#fff" stroke="#d5dde5"/><text x="216" y="56">📷</text>
      <rect x="252" y="32" width="38" height="34" rx="10" fill="#fff" stroke="#d5dde5"/><text x="260" y="56">🎟</text>
      <circle cx="286" cy="34" r="8" fill="#3A8A8C"/><text x="282" y="38" font-size="10" fill="#fff" font-weight="700">2</text>
      <rect x="296" y="32" width="38" height="34" rx="10" fill="#fff" stroke="#d5dde5"/><text x="304" y="56">🃏</text>
      <circle cx="330" cy="34" r="8" fill="#F59C3C"/><text x="326" y="38" font-size="10" fill="#fff" font-weight="700">1</text>
    </g>

    <!-- same score strip -->
    <g font-size="12">
      <rect x="22" y="80" width="316" height="44" rx="14" fill="#fff" stroke="#d5dde5"/>
      <rect x="26" y="84" width="86" height="36" rx="11" fill="#FFE9D6" stroke="#E8431A" stroke-width="2"/>
      <circle cx="42" cy="102" r="8" fill="#E8431A"/><text x="55" y="107" font-weight="700" fill="#1B2B4B">Anna 47</text>
      <circle cx="130" cy="102" r="8" fill="#3A8A8C"/><text x="143" y="107" fill="#1B2B4B">Ben 52</text>
      <circle cx="203" cy="102" r="8" fill="#7B4FC9"/><text x="216" y="107" fill="#1B2B4B">Cla 31</text>
      <circle cx="270" cy="102" r="8" fill="#F59C3C"/><text x="283" y="107" fill="#1B2B4B">Dani 40</text>
    </g>

    <text x="30" y="152" font-size="13" font-weight="700" fill="#6b7785">⛷️ BERGAB · Anna</text>

    <!-- dice -->
    <rect x="60" y="166" width="96" height="96" rx="20" fill="#fff" stroke="#1B2B4B" stroke-width="3"/>
    <text x="108" y="222" text-anchor="middle" font-size="44" font-weight="800" fill="#1B2B4B">4</text>
    <text x="108" y="248" text-anchor="middle" font-size="14" fill="#F59C3C">★★</text>
    <rect x="204" y="166" width="96" height="96" rx="20" fill="#dcecf7" stroke="#1B2B4B" stroke-width="3"/>
    <text x="252" y="224" text-anchor="middle" font-size="44">❄️</text>
    <text x="252" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2B4B">Schneesturm</text>

    <!-- result bubble + optional Joker on event -->
    <rect x="30" y="276" width="300" height="46" rx="14" fill="#1B2B4B"/>
    <text x="46" y="304" font-size="14" fill="#fff">❄ Nur <tspan font-weight="800">2 Kreuzungen</tspan> erlaubt</text>
    <rect x="258" y="284" width="64" height="30" rx="10" fill="#F59C3C"/>
    <text x="290" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🃏 Joker</text>

    <!-- slope selector -->
    <text x="30" y="352" font-size="16" font-weight="800" fill="#1B2B4B">Welche Pisten bist du gefahren?</text>
    <text x="330" y="352" text-anchor="end" font-size="13" font-weight="700" fill="#3A8A8C">2 / 2 ✓</text>

    <g font-size="15">
      <!-- blue -->
      <rect x="30" y="366" width="300" height="52" rx="14" fill="#fff" stroke="#d5dde5"/>
      <rect x="30" y="366" width="12" height="52" rx="6" fill="#2F6FDB"/>
      <text x="54" y="398" font-weight="700" fill="#1B2B4B">Blau <tspan font-size="12" fill="#6b7785" font-weight="400">2 P.</tspan></text>
      <circle cx="232" cy="392" r="16" fill="#e9eef3"/><text x="232" y="398" text-anchor="middle" font-size="18" fill="#9aa5b1">−</text>
      <text x="268" y="398" text-anchor="middle" font-size="18" font-weight="800" fill="#9aa5b1">0</text>
      <circle cx="304" cy="392" r="16" fill="#e9eef3"/><text x="304" y="398" text-anchor="middle" font-size="18" fill="#9aa5b1">+</text>
      <!-- red -->
      <rect x="30" y="426" width="300" height="52" rx="14" fill="#fff" stroke="#D93A3A" stroke-width="2"/>
      <rect x="30" y="426" width="12" height="52" rx="6" fill="#D93A3A"/>
      <text x="54" y="458" font-weight="700" fill="#1B2B4B">Rot <tspan font-size="12" fill="#6b7785" font-weight="400">4 P.</tspan></text>
      <circle cx="232" cy="452" r="16" fill="#1B2B4B"/><text x="232" y="458" text-anchor="middle" font-size="18" fill="#fff">−</text>
      <text x="268" y="458" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2B4B">1</text>
      <circle cx="304" cy="452" r="16" fill="#e9eef3"/><text x="304" y="458" text-anchor="middle" font-size="18" fill="#9aa5b1">+</text>
      <!-- black -->
      <rect x="30" y="486" width="300" height="52" rx="14" fill="#fff" stroke="#222" stroke-width="2"/>
      <rect x="30" y="486" width="12" height="52" rx="6" fill="#222"/>
      <text x="54" y="518" font-weight="700" fill="#1B2B4B">Schwarz <tspan font-size="12" fill="#6b7785" font-weight="400">6 P.</tspan></text>
      <circle cx="232" cy="512" r="16" fill="#1B2B4B"/><text x="232" y="518" text-anchor="middle" font-size="18" fill="#fff">−</text>
      <text x="268" y="518" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2B4B">1</text>
      <circle cx="304" cy="512" r="16" fill="#e9eef3"/><text x="304" y="518" text-anchor="middle" font-size="18" fill="#9aa5b1">+</text>
      <!-- yellow (not allowed at ★★) -->
      <g opacity="0.5">
        <rect x="30" y="546" width="300" height="52" rx="14" fill="#fff" stroke="#d5dde5" stroke-dasharray="5 4"/>
        <rect x="30" y="546" width="12" height="52" rx="6" fill="#E8C21A"/>
        <text x="54" y="572" font-weight="700" fill="#1B2B4B">Gelb <tspan font-size="12" fill="#6b7785" font-weight="400">8 P.</tspan></text>
        <text x="54" y="589" font-size="11" fill="#E8431A">⚠ ohne Befugnis → Entscheidungswürfel</text>
        <circle cx="304" cy="572" r="16" fill="#e9eef3"/><text x="304" y="578" text-anchor="middle" font-size="18" fill="#9aa5b1">+</text>
      </g>
    </g>

    <!-- optional extra: small chip, not a whole card -->
    <rect x="30" y="612" width="190" height="36" rx="18" fill="#fff" stroke="#3A8A8C" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="125" y="636" text-anchor="middle" font-size="13" font-weight="700" fill="#3A8A8C">🎲 Extraaktivität würfeln</text>

    <!-- primary button -->
    <rect x="30" y="676" width="300" height="64" rx="22" fill="#E8431A"/>
    <rect x="30" y="734" width="300" height="6" rx="3" fill="#b8330f"/>
    <text x="180" y="716" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">+10 Punkte eintragen →</text>
  </g>

  <!-- legend -->
  <text x="430" y="852" text-anchor="middle" font-size="11" fill="#6b7785">Oben immer gleich: ☰ Menü · Uhr/Runde · Schnellaktionen (📷 Sehenswürdigkeit, 🎟 Gratis Fahrt, 🃏 Joker) · Punkte-Leiste</text>
</svg>
